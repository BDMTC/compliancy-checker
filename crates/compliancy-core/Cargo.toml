[package]
name = "compliancy-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Pipeline + Assist LLM hook for Compliancy Checker (no GUI)"
publish = false

[dependencies]
docx-core = { path = "../docx-core" }
pdf-core = { path = "../pdf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
